<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 650" width="840" height="650" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f85149"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="840" height="650" fill="#0d1117"/>
  <rect x="1" y="1" width="838" height="648" rx="16" fill="none" stroke="#30363d" stroke-width="2"/>

  <!-- Internet -->
  <ellipse cx="420" cy="40" rx="95" ry="30" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="420" y="46" text-anchor="middle" fill="#58a6ff" font-size="16" font-weight="600">Internet</text>

  <!-- Arrow: Internet -> pfSense -->
  <line x1="420" y1="70" x2="420" y2="108" stroke="#8b949e" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- pfSense Firewall -->
  <rect x="320" y="110" width="200" height="60" rx="10" fill="#D64000"/>
  <text x="420" y="146" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">pfSense Firewall</text>

  <!-- Branch arrows -->
  <line x1="420" y1="170" x2="210" y2="213" stroke="#8b949e" stroke-width="2" marker-end="url(#arrowGray)"/>
  <line x1="420" y1="170" x2="630" y2="213" stroke="#8b949e" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- Linux Server -->
  <rect x="110" y="215" width="200" height="70" rx="10" fill="#166534"/>
  <text x="210" y="245" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">Linux Server</text>
  <text x="210" y="266" text-anchor="middle" fill="#d1fae5" font-size="13">Ubuntu / Rocky</text>

  <!-- Kali Linux -->
  <rect x="530" y="215" width="200" height="70" rx="10" fill="#557C94" stroke="#f85149" stroke-width="2"/>
  <text x="630" y="245" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">Kali Linux</text>
  <text x="630" y="266" text-anchor="middle" fill="#e5f0f5" font-size="13">Attack Host</text>

  <!-- Attack traffic arrow -->
  <line x1="530" y1="250" x2="312" y2="250" stroke="#f85149" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowRed)"/>
  <text x="420" y="238" text-anchor="middle" fill="#f85149" font-size="13" font-style="italic">Attack Traffic</text>

  <!-- Security Logs arrow -->
  <line x1="210" y1="285" x2="210" y2="328" stroke="#8b949e" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="228" y="311" text-anchor="start" fill="#8b949e" font-size="13">Security Logs</text>

  <!-- Wazuh SIEM -->
  <rect x="110" y="330" width="200" height="60" rx="10" fill="#0288D1"/>
  <text x="210" y="356" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">Wazuh</text>
  <text x="210" y="376" text-anchor="middle" fill="#ffffff" font-size="14">SIEM</text>

  <!-- Arrow: Wazuh -> Investigation -->
  <line x1="210" y1="390" x2="210" y2="433" stroke="#8b949e" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- Investigation & Detection -->
  <rect x="110" y="435" width="200" height="70" rx="10" fill="#7C3AED"/>
  <text x="210" y="465" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">Investigation</text>
  <text x="210" y="486" text-anchor="middle" fill="#ede9fe" font-size="13">&amp; Detection</text>

  <!-- Arrow: Investigation -> Incident Report -->
  <line x1="210" y1="505" x2="210" y2="548" stroke="#8b949e" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- Incident Report -->
  <rect x="110" y="550" width="200" height="60" rx="10" fill="#B91C1C"/>
  <text x="210" y="576" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">Incident</text>
  <text x="210" y="596" text-anchor="middle" fill="#ffffff" font-size="14">Report</text>
</svg>
